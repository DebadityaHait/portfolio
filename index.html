<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#30445a" />
    <meta name="description" content="Debaditya Hait builds software across systems, AI, and the web. Explore open source contributions to Ruff, TensorFlow, Neovim, and more, plus selected independent projects." />
    <meta property="og:title" content="Debaditya Hait | A work in progress" />
    <meta property="og:description" content="Software, open source, and things built out of curiosity." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dhait.de/" />
    <link rel="canonical" href="https://dhait.de/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Debaditya Hait | Software & Open Source</title>
    <style>
      :root { --mat:#30445a; background:var(--mat); color-scheme:light; }
      :root[data-theme='dark'] { --mat:#1c2d40; color-scheme:dark; }
      :root[data-palette='forest'] { --mat:#2d493c; }
      :root[data-palette='plum'] { --mat:#4a3e50; }
      :root[data-palette='forest'][data-theme='dark'] { --mat:#1e342b; }
      :root[data-palette='plum'][data-theme='dark'] { --mat:#322b3c; }
      body { margin:0; background:var(--mat); }
    </style>
    <script>
      (() => {
        let theme, palette;
        try { theme=localStorage.getItem('desk-theme'); palette=localStorage.getItem('desk-palette'); } catch {}
        const root=document.documentElement;
        root.dataset.theme=['light','dark'].includes(theme)?theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        root.dataset.palette=['blue','forest','plum'].includes(palette)?palette:'blue';
        document.querySelector('meta[name="theme-color"]').content={blue:{light:'#30445a',dark:'#1c2d40'},forest:{light:'#2d493c',dark:'#1e342b'},plum:{light:'#4a3e50',dark:'#322b3c'}}[root.dataset.palette][root.dataset.theme];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
